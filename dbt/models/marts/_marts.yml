version: 2

models:
  - name: dim_teams
    description: Every club seen since 2014-15 with each source's identifier.
    columns:
      - name: team_key
        data_tests: [unique, not_null]
      - name: fpl_team_code
        data_tests: [unique]
      - name: football_data_name
        data_tests: [unique]
      - name: understat_team_id
        data_tests: [unique, not_null]

  - name: fct_matches
    description: >
      One row per Premier League match since 2014-15 (grain: season x home x away),
      combining FPL, football-data.co.uk, Understat and FPL-Elo-Insights. Implied
      probabilities have the bookmaker margin removed proportionally.
    columns:
      - name: match_key
        data_tests: [unique, not_null]
      - name: season
        data_tests: [not_null]
      - name: home_team_key
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_teams'), field: team_key}}
      - name: away_team_key
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_teams'), field: team_key}}
      - name: match_date
        data_tests: [not_null]
      - name: fpl_fixture_id
        description: Null before 2016-17, when FPL-coded history starts.
      - name: p_home_win
        description: Opening implied home-win probability, margin removed.

  - name: dim_players
    description: One row per player across seasons (FPL's stable `code`), latest name.
    columns:
      - name: player_code
        data_tests: [unique, not_null]

  - name: fct_player_matches
    description: >
      One row per player per fixture since 2016-17, including unused squad members.
      FPL stats, points and price every season; Opta detail (touches, chances created,
      xGOT, duels) from 2024-25. `total_points` follows each season's own scoring rules.
    columns:
      - name: player_match_key
        data_tests: [unique, not_null]
      - name: match_key
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('fct_matches'), field: match_key}}
      - name: player_code
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_players'), field: player_code}}
      - name: team_key
        data_tests: [not_null]
      - name: opponent_team_key
        data_tests: [not_null]
      - name: position
        data_tests:
          - not_null
          - accepted_values: {arguments: {values: [GKP, DEF, MID, FWD]}}
      - name: minutes
        data_tests:
          - not_null
          - value_between: {arguments: {low: 0, high: 130}}
