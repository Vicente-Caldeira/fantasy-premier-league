[project]
name = "fpl-models"
version = "0.0.0"
description = "Feature engineering, component models, backtesting and optimisation"
requires-python = ">=3.12,<3.13"
dependencies = ["fpl-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_models"]
