[project]
name = "fpl-models"
version = "0.0.0"
description = "Feature engineering, component models, backtesting and optimisation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5",
    "fpl-core",
    "mlflow-skinny>=3.17",
    "numpy>=2.0",
    "polars>=2.0",
    "scipy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_models"]
