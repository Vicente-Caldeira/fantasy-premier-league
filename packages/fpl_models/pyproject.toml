[project]
name = "fpl-models"
version = "0.0.0"
description = "Feature engineering, component models, backtesting and optimisation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5",
    "fpl-core",
    "mlflow-skinny>=3.17",
    "numpy>=2.0",
    "ortools>=9.12",
    "polars>=2.0",
    "scikit-learn>=1.6",
    "scipy>=1.14",
]

[project.optional-dependencies]
# E19: NVIDIA Kumo Tabular (in-context tabular foundation model; pulls in PyTorch).
# torch is direct so Linux can take the CPU-only wheels (no CUDA stack) from the index below.
kumo = ["structured-data-models==0.2.1", "torch>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_models"]
