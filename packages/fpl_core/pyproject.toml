[project]
name = "fpl-core"
version = "0.0.0"
description = "FPL domain model: positions, scoring rules, shared schemas"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_core"]
