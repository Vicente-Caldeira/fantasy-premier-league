[project]
name = "fpl-pipelines"
version = "0.0.0"
description = "Dagster code location: ingestion, transformation, training and inference"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fpl-core",
    "fpl-models",
    "dagster>=1.9",
    "dagster-postgres>=0.25",
    "dagster-webserver>=1.9",
    "psycopg[binary]>=3.2",
    "polars>=2.0",
    "fsspec>=2025.1",
    "gcsfs>=2025.1",
    "dbt-core>=1.12",
    "dbt-duckdb>=1.11",
    "dbt-bigquery>=1.12",
    "dagster-dbt>=0.29",
    "duckdb>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_pipelines"]

[tool.dagster]
module_name = "fpl_pipelines.definitions"
