name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: dbt parse (validates models, sources and tests without data)
        working-directory: dbt
        run: uv run dbt parse --profiles-dir .
      - run: uv run pytest --cov --cov-report=term-missing
      - name: Billing kill-switch tests
        working-directory: infra/terraform/bootstrap/functions/billing_kill_switch
        run: >
          uv run --no-project --python 3.12 --with-requirements requirements.txt --with pytest
          python -m pytest -q -p no:cacheprovider -o addopts="" --rootdir=.

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive infra/terraform
      - working-directory: infra/terraform/bootstrap
        run: terraform init -backend=false -input=false && terraform validate

  images:
    runs-on: ubuntu-latest
    strategy:
      # Report every image's result rather than cancelling the rest on the first failure.
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: docker/python.Dockerfile
            args: PACKAGE=fpl-api
          - name: pipelines
            context: .
            file: docker/python.Dockerfile
            args: PACKAGE=fpl-pipelines
          - name: web
            context: apps/web
            file: docker/web.Dockerfile
            args: ""
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Single required check for branch protection, independent of matrix job names.
  ci-ok:
    if: always()
    needs: [python, web, terraform, images]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
