[project]
name = "fpl-api"
version = "0.0.0"
description = "HTTP API serving predictions, user teams and recommendations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5",
    "fpl-core",
    "fpl-models",
    "fastapi>=0.115",
    "polars>=2.0",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_api"]
